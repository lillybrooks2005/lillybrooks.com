<!--
  The browser-tab icon: the LB monogram on a pink dot set slightly off-centre, like the colour washes behind the doodles.
  Colours are --color-pink and --color-ink from app/tokens.css; an SVG file can't read CSS tokens, so keep them in sync by hand.
  The line is much heavier than in the header logo so it survives at 16px. app/apple-icon.png is the same drawing for phone home screens.
-->
